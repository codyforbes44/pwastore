<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>PWA Store - Discover Progressive Web Apps</title>
    <meta name="title" content="PWA Store - Discover Progressive Web Apps" />
    <meta name="description" content="Discover, install, and share the best Progressive Web Apps. A curated marketplace for modern web applications." />
    <meta name="author" content="PWA Store" />
    <meta name="keywords" content="PWA, Progressive Web Apps, App Store, Web Apps, Install Apps" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#8B5CF6" />
    <meta name="msapplication-TileColor" content="#0A0A0F" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon-32.png" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Apple Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PWA Store" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pwa.store/" />
    <meta property="og:title" content="PWA Store - Discover Progressive Web Apps" />
    <meta property="og:description" content="Discover, install, and share the best Progressive Web Apps. A curated marketplace for modern web applications." />
    <meta property="og:image" content="/icon-512.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://pwa.store/" />
    <meta name="twitter:title" content="PWA Store - Discover Progressive Web Apps" />
    <meta name="twitter:description" content="Discover, install, and share the best Progressive Web Apps. A curated marketplace for modern web applications." />
    <meta name="twitter:image" content="/icon-512.png" />
    
    <!-- Canonical -->
    <link rel="canonical" href="https://pwa.store/" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
